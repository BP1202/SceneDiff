# alembic.ini — Alembic configuration for SceneDiff
#
# The sqlalchemy.url value is intentionally omitted here.
# env.py reads DATABASE_URL from pydantic Settings at runtime so that
# no credentials are hard-coded in version control.

[alembic]
# Path to the migration scripts directory, relative to this file.
script_location = alembic

# Template used when generating new migration files.
# "%(rev)s" and "%(slug)s" are substitution tokens.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Prepend sys.path with this directory so that "app" is importable when
# Alembic is invoked from the backend/ directory.
prepend_sys_path = .

# Timezone used for revision timestamps.
timezone = UTC

# Maximum character length of the slug portion of the filename.
truncate_slug_length = 40

# Set to "true" to emit revision-related output.
revision_environment = false

# Set to "true" to generate .pyc files alongside .py revisions.
sourceless = false

# Version location — defaults to alembic/versions/.
# version_locations = %(here)s/bar:%(here)s/bat:alembic/versions

# Version path separator on Windows.
version_path_separator = os

# Output encoding for the migration scripts.
output_encoding = utf-8

# ---------------------------------------------------------------------------
# Logging configuration
# Alembic uses Python's stdlib logging.  Adjust levels here to control
# console verbosity during migrations.
# ---------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
